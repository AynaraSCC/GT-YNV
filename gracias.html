<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#090909">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/icon-180.png">
  <title>Tu pago | Golden Ticket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="thanks-page">
  <main class="thanks">
    <a class="brand" href="index.html"><img class="brand-logo" src="assets/images/logo-yenova.png" alt="YeNoVa Cupcakes" width="520" height="243"><span class="brand-name">GOLDEN <b>TICKET</b></span></a>
    <div class="thanks-card" id="thanks" data-state="loading">
      <p class="eyebrow" id="t-eyebrow">UN MOMENTO…</p>
      <h1 id="t-title">Estamos revisando <em>tu pago.</em></h1>
      <div class="buy-ticket thanks-ticket"><span>GOLDEN TICKET</span><b id="t-number">···</b><small id="t-ref"></small></div>
      <p id="t-text">Esto toma solo unos segundos.</p>
      <div class="thanks-actions">
        <a class="button button-gold" href="index.html#tiquetes" id="t-back">Volver a la rifa <span>↗</span></a>
        <a class="button button-outline" id="t-wa" hidden target="_blank" rel="noopener">Escríbenos por WhatsApp</a>
      </div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script>
  (async () => {
    const cfg = window.GT_CONFIG || {};
    const $ = (id) => document.getElementById(id);
    const id = new URLSearchParams(location.search).get("id");
    let guardado = {};
    try { guardado = JSON.parse(sessionStorage.getItem("gt-compra") || "{}"); } catch (_) {}
    const pad = (n) => String(n).padStart(3, "0");
    const show = (eyebrow, title, text, state) => {
      $("t-eyebrow").textContent = eyebrow; $("t-title").innerHTML = title; $("t-text").textContent = text;
      $("thanks").dataset.state = state;
    };
    if (guardado.numero) $("t-number").textContent = pad(guardado.numero);
    if (!id) return show("SIN INFORMACIÓN", "No encontramos <em>tu pago.</em>", "Si ya pagaste, revisa tu correo o escríbenos.", "error");

    const base = cfg.wompiAmbiente === "produccion" ? "https://production.wompi.co/v1" : "https://sandbox.wompi.co/v1";
    for (let intento = 0; intento < 8; intento++) {
      try {
        const r = await fetch(`${base}/transactions/${encodeURIComponent(id)}`);
        const tx = (await r.json()).data;
        const ref = tx.reference || "";
        const m = ref.match(/^GT-(\d{3})-/);
        if (m) $("t-number").textContent = m[1];
        $("t-ref").textContent = ref;
        if (cfg.whatsappContacto) {
          const msg = `Hola! Compré el Golden Ticket #${m ? m[1] : ""}. Referencia: ${ref}`;
          $("t-wa").href = `https://wa.me/${cfg.whatsappContacto}?text=${encodeURIComponent(msg)}`;
          $("t-wa").hidden = false;
        }
        if (tx.status === "APPROVED") return show("¡PAGO APROBADO!", "Tu número ya es <em>tuyo.</em>", "Te enviamos la confirmación a tu correo. ¡Mucha suerte en el sorteo!", "ok");
        if (["DECLINED", "VOIDED", "ERROR"].includes(tx.status)) return show("PAGO NO APROBADO", "Tu pago <em>no se completó.</em>", "No se hizo ningún cobro y el número quedó libre de nuevo. Puedes intentarlo otra vez.", "error");
      } catch (_) {}
      await new Promise((res) => setTimeout(res, 3000));
    }
    show("PAGO EN PROCESO", "Tu pago está <em>en revisión.</em>", "Algunos pagos (como PSE) tardan unos minutos. Cuando se apruebe te llegará un correo y tu número se verá en gris en la cuadrícula.", "pending");
  })();
  </script>
</body>
</html>
